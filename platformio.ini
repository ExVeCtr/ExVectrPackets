; Host (native) tests for the generated packet code. The legacy hand-written headers under include/ are not
; built here (they need ExVectrCore/ExVectrMath); tools/check_legacy_headers.sh checks them separately.
; Run: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++17 -Wall -Wextra -Igen -Itest/generated/cpp
