# Starship vehicle packets (network-design.md 3.5.6, adapted by the user decisions in its Revision 1 box).
#
# Two telemetry sets:
#   AIR set (radio, ports < 0x80, bare minimum, fixed-point): VEHICLE_STATUS, AIR_POSE, AIR_ACTUATORS, AIR_MISSION, plus HANDSET_TELEM and
#     LINK_STATS from common.toml.
#   USB set (everything, ports >= 0x80 are USB only, f32/f64): the AIR set packets that have a USB rate, plus
#     POSE, ACTUATORS, MISSION, GNSS and the debug packets. AIR_POSE is not sent on USB (POSE supersedes it).
# Packets are grouped by rate class: POSE is the fast class, VEHICLE_STATUS/MISSION/ACTUATORS the slower ones.
# All decoded physical values are SI. Timestamps t_us / t_ns are integer counters (wrap handling needs integers).
# Frames: NWU world, attitude q = [w,x,y,z] body -> world, position [V(3), P(3)].

[schema]
name = "starship"
doc = "Starship vehicle telemetry."

# LINK_UPLOAD_MODE (10): target = link module node id (2 = TX module, 3 = RX module). The module stops
# the air link and enters its over-the-air firmware upload (WiFi) mode. Always honoured, no safety
# condition (user decision 2026-11-19): senders must never send it unintentionally. arg_i/arg_f = 0,
# REQUEST_ACK detail = 0.
# LINK_REBOOT (11): same semantics (target, always honoured, ACK first, 400 ms delay, idempotent), but the module
# does a clean software restart instead. A reboot of the RX module in flight stops RC for a few seconds
# (failsafe): senders must guard it.
# ZERO_ESTIMATORS (12, T9b): start an estimator zeroing window on the vehicle (what the Zero telecommand did). target = 1
# (vehicle), arg_f = window in s (NaN or 0: 10 s, clamped 1..60 s), arg_i = 0. Refused unless initialised, disarmed, motors off and in
# mode Startup or Ready; the vehicle must be still. Idempotent by req_id.
[enum.RequestAction]
type = "u8"
values = { NONE = 0, CALIB_GYRO_START = 1, CALIB_GYRO_STOP = 2, CALIB_ACCEL_START = 3, CALIB_ACCEL_STOP = 4, CALIB_MAG_START = 5, CALIB_MAG_STOP = 6, CALIB_APPLY = 7, SAVE_CONFIG = 8, SYSTEM_RESET = 9, LINK_UPLOAD_MODE = 10, LINK_REBOOT = 11, ZERO_ESTIMATORS = 12 }

# Frame of the raw sensor values that CALIBRATION applies to (IMU_RAW gyro, accel, mag).
[enum.ImuFrame]
type = "u8"
values = { SENSOR = 0, BODY = 1 }

# GS-control design (2026-11-23): the ground station (node 0, over USB or UART) is the only control source. 1 was RADIO and
# 2/3 USB/UART before; those values are retired (never sent by the new vehicle, decoded as plain ints).
[enum.ControlSource]
type = "u8"
values = { NONE = 0, GS = 1 }

# CMD_STATE field enums. All are strict: a value that is not a member rejects the whole CMD_STATE frame.
[enum.CmdGo]
type = "u8"
values = { NOT_GO = 0, GO = 1 }

[enum.CmdVehicleMode]
type = "u8"
values = { REAL = 0, SIMULATION = 1 }

[enum.CmdMotors]
type = "u8"
values = { DISABLED = 0, ENABLED = 1 }

[enum.CmdButton]
type = "u8"
values = { RELEASED = 0, PRESSED = 1 }

[enum.CmdFailsafe]
type = "u8"
values = { NONE = 0, FAILSAFE = 1 }

# ---------------------------------------------------------------- Control (uplink)

[packet.CMD_STATE]
port = 0x13
qos = "control"
latest = true
doc = "GS-control design (2026-11-23): the complete command state of the ground station (node 0) to the vehicle (node 1), level-based and repeated at 25 Hz (plus an immediate frame on every change), identical frame (same sequence) on every link. Strict: every field must be a declared value (enum members, version 1, session non-zero, reserved zero, flags bit 0 set and only bits 0..2); anything else rejects the whole frame, which counts as no data (decode fails). No authentication field (owner decision 2026-11-23). Port 0x13 is in the common control range so routers class it as CONTROL without knowing this layout; only src 0 -> dst 1 is forwarded. The SA..SE mapping: go = SA, profile = SB, vehicle_mode = SC (command value 0 = real, 1 and 2 = simulation on the handset; the vehicle boots real), motors = SD (motors armed / disarmed), reset_button = SE (short press reset, hold >= 1 s zero while held), go = mission begin edge request (NOT_GO -> GO observed edge)."
fields = [
  { name = "flags",        type = "u8", valid = [1, 3, 5, 7], bits = { VALID = 0, POCKET_LIVE = 1, INPUT_VIRTUAL = 2 }, doc = "VALID must be 1. POCKET_LIVE (the handset stream is alive at the GS) and INPUT_VIRTUAL (input is the virtual panel) are information only: the vehicle reports them, never acts on them. Bits 3..7 must be 0." },
  { name = "version",      type = "u8", valid = [1], doc = "CMD_STATE layout version, must be 1" },
  { name = "session",      type = "u32", min_value = 1, doc = "random per GS process start, never 0; the vehicle latches one session and rejects frames of any other" },
  { name = "go",           type = "enum", enum = "CmdGo", strict = true, doc = "SA: mission begin edge request. NOT_GO also aborts while pending or running" },
  { name = "profile",      type = "u8", valid = [0, 1, 2], doc = "SB position 0, 1, 2, latched at the go edge" },
  { name = "vehicle_mode", type = "enum", enum = "CmdVehicleMode", strict = true, doc = "SC: REAL = command value 0, SIMULATION = 1 and 2 (the vehicle boots real); an observed change is applied on the ground when not committed" },
  { name = "motors",       type = "enum", enum = "CmdMotors", strict = true, doc = "SD: motors armed (ENABLED) / disarmed (DISABLED), the interlock input" },
  { name = "reset_button", type = "enum", enum = "CmdButton", strict = true, doc = "SE: short press = reset, hold >= 1 s = zero while held" },
  { name = "failsafe",     type = "enum", enum = "CmdFailsafe", strict = true, doc = "FAILSAFE = GS failsafe requested (latched failsafe on the vehicle, any state); sent together with motors DISABLED and go NOT_GO" },
  { name = "reserved",     type = "u16", valid = [0], doc = "must be 0 (kept so the payload stays 14 B)" },
]

# ---------------------------------------------------------------- AIR set

[packet.VEHICLE_STATUS]
port = 0x20
qos = "link"
latest = true
rate_air = 5
rate_usb = 20
doc = "Mode and health, the slow class. Reports what the vehicle applied (safety.md 2.6)."
fields = [
  { name = "t_us",            type = "u32", unit = "us", doc = "vehicle time, (NowNs/1000) mod 2^32" },
  { name = "t_ns",            type = "i64", unit = "ns", doc = "full vehicle time NowNs()" },
  { name = "mode",            type = "u8", doc = "flight software mode (numbering owned by the flight software docs)" },
  { name = "mission_mode",    type = "u8" },
  { name = "mission_phase",   type = "u8" },
  { name = "ctrl_source",     type = "enum", enum = "ControlSource", doc = "active control source: 0 none, 1 GS (the latched CMD_STATE session)" },
  { name = "flags",           type = "u8", bits = { ARMED = 0, SIMULATION = 1, MOTORS_ENABLED = 2, GS_PRESENT = 3, INCOMPATIBLE = 4, FAILSAFE = 5, UART_PEER_SEEN = 6, ZEROING = 7 }, doc = "ARMED (redefined by T9b, 2026-11-22): motors armed = the motor interlock is open (CMD_STATE motors ENABLED accepted; SD is named motors armed / disarmed); the vehicle-side arm state is no longer a separate flag. MOTORS_ENABLED: the interlock is open AND the motor outputs are enabled (the hard motor gate is open). UART_PEER_SEEN: a valid frame from the ship radio node (node 3) arrived on the vehicle UART within the last 3 s (information only, the vehicle never acts on it). ZEROING: an estimator zeroing window is active (automatic boot zero or ZeroEstimators); the vehicle must be kept still, Arm and MissionBegin are refused." },
  { name = "failure_bits",    type = "u32", doc = "bit 0 sensor (set for any sensor failsafe, kept for compatibility), 1 attitude, 2 position, 3 position out of bounds, 4 attitude out of bounds, 5 CONTROL_SOURCE_LOST (renamed from radio connection loss: the accepted CMD_STATE was older than 2 s while committed), 6 GNSS lost (abort to no-position RTH), 7 magnetometer lost (abort to no-position RTH), 8 barometer, 9 gyro, 10 accelerometer, 11 attitude estimate, 12 position estimate, 13 motor-interlock watchdog. Bits 6-13 are defined by T9b; a sender before T9b never sets them. 14 GS_FAILSAFE (an accepted CMD_STATE carried failsafe = 1; latched, cleared by the SE reset while the request is 0). Bits 15..31 are reserved (zero)." },
  { name = "sensor_state",    type = "u16" },
  { name = "last_req_id",     type = "u16", doc = "last executed REQUEST id, 0 = none" },
  { name = "last_req_status", type = "u8", doc = "RequestStatus value of last_req_id" },
  { name = "rc_age",          type = "fixed", wire = "u16", scale = 0.001, unit = "s", doc = "age of the last accepted CMD_STATE (either link), invalid (NaN) = none" },
  { name = "home_epoch",      type = "u8", optional = true, doc = "increments whenever the home reference (HOME_POSITION) changes; the GS requests HOME_POSITION again when it changes. 0 = no home yet. Missing (older sender) decodes as 0" },
  { name = "calib_state",     type = "u8", optional = true, doc = "calibration state bits. bit0 gyro calibration valid, bit1 accel calibration valid, bit2 mag calibration valid, bit3 a calibration session is active (collecting or fitting), bit4 ready to arm (all gates the vehicle applies for Arm and MissionBegin are satisfied), bits 5-7 reserved (zero). Missing (older sender) decodes as 0 = unknown" },
  { name = "ctrl_flags",      type = "u16", optional = true, bits = { INTERLOCK_NEED_TOGGLE = 0, ABORT_LATCHED = 1, FAILSAFE_LATCHED = 2, NOPOS_RTH = 3, SC_MISMATCH = 4, SE_HOLD_ZEROING = 5, SE_REFUSED = 6, USB_FRESH = 7, UART_FRESH = 8, SOURCE_LATCHED = 9, REQ_QUEUE_FULL = 10, MULTI_MASTER = 11, GS_FAILSAFE_REQ = 12 }, doc = "T9b command-path state. INTERLOCK_NEED_TOGGLE: SD must be toggled disabled -> enabled before the interlock opens. ABORT_LATCHED / FAILSAFE_LATCHED: latched until the SE reset (CMD_STATE reset_button) while disarmed on the ground. NOPOS_RTH: the no-position return-to-home is active. SC_MISMATCH: SC differs from the applied mode. SE_HOLD_ZEROING: SE held, zeroing in progress. SE_REFUSED: an SE press was refused (shown for 2 s). USB_FRESH / UART_FRESH (bits 7 and 8, formerly RADIO_FRESH / BENCH_FRESH): an accepted or duplicate CMD_STATE of the latched session arrived on that link at most 2 s ago (information only). SOURCE_LATCHED: the GS session is latched because the vehicle is committed. REQ_QUEUE_FULL: the REQUEST queue is full. MULTI_MASTER: a CMD_STATE of a foreign session was rejected within the last 2 s. GS_FAILSAFE_REQ: the last accepted CMD_STATE carried failsafe = 1. Bits 13..15 reserved (zero). Missing (older sender) decodes as 0" },
  { name = "go_refusal",      type = "u8", optional = true, doc = "reason for the last refused go: 0 none, 1 not Ready, 2 latched abort/failsafe, 3 zeroing window, 4 SC mismatch, 5 SB invalid or profile not implemented, 6 interlock, 7 request in progress. Missing decodes as 0" },
  { name = "degraded_bits",   type = "u8", optional = true, bits = { TOF_LOST = 0, LINK_STATS_LOST = 1, UART_HEARTBEAT_LOST = 2 }, doc = "degraded warnings (no action taken, not latched): bit 0 ToF ground distance no sample for 1 s while initialised, bit 1 ship-node LINK_STATS on the UART older than 1 s while the UART link is fresh, bit 2 ship-node heartbeat on the UART older than 3 s while the UART link is fresh. Bits 3..7 reserved (zero). Missing decodes as 0" },
  { name = "mission_profile", type = "u8", optional = true, doc = "SB position latched at the last go (0, 1, 2), 255 = none. NOTE: a missing field (older sender) decodes as 0, indistinguishable from profile 0; use calib_state/ctrl_flags presence via the payload length if that matters" },
  { name = "rc_rejected",     type = "u8", optional = true, doc = "wrapping count of rejected CMD_STATE frames (all reasons, both links). Missing decodes as 0" },
  { name = "cmd_session",     type = "u16", optional = true, doc = "low 16 bits of the latched CMD_STATE session id, 0 = none. The ground station compares it with its own session (NOT MASTER if different). Missing decodes as 0" },
]

[packet.AIR_POSE]
port = 0x21
qos = "telemetry"
latest = true
rate_air = 25
doc = "Minimal pose for the radio: attitude, position and velocity, fixed-point."
fields = [
  { name = "t_us", type = "u32", unit = "us" },
  { name = "q",    type = "fixed", wire = "i16", limit = 1.0, count = 4, doc = "[w,x,y,z] body -> world" },
  { name = "pos",  type = "fixed", wire = "i32", scale = 0.001, count = 3, unit = "m", doc = "NWU, 1 mm resolution, +-2147483.6 m" },
  { name = "vel",  type = "fixed", wire = "i16", scale = 0.01, count = 3, unit = "m/s", doc = "NWU, +-327.66 m/s" },
]

[packet.AIR_ACTUATORS]
port = 0x22
qos = "telemetry"
latest = true
rate_air = 25
doc = "Actuator outputs for flight recording over the radio: two samples per packet (newest and the previous one, nominally 20 ms older), so 25 packets/s give 50 samples/s and one lost packet loses no sample. Same source and definitions as ACTUATORS. Array order: the newest sample first, then the previous one."
fields = [
  { name = "t_us",        type = "u32", unit = "us", doc = "vehicle time of the newest sample, (NowNs/1000) mod 2^32" },
  { name = "prev_age",    type = "fixed", wire = "u16", scale = 0.000001, unit = "s", doc = "newest sample time minus previous sample time (nominally 0.020 s), NaN = no previous sample (its values are NaN too)" },
  { name = "tvc",         type = "fixed", wire = "i16", scale = 0.0001, count = 4, unit = "rad", doc = "thrust vector deflection as ACTUATORS.tvc: [x, y] newest, then [x, y] previous; +-3.2767 rad at 0.1 mrad" },
  { name = "roll_torque", type = "fixed", wire = "i16", scale = 0.00001, count = 2, unit = "N*m", doc = "TVC twist (roll) actuation as the roll torque about body Z the vanes produce: newest, previous; +-0.32767 N*m at 0.01 mN*m" },
  { name = "thrust",      type = "fixed", wire = "u16", scale = 0.001, count = 2, unit = "N", doc = "thrust magnitude as ACTUATORS.thrust: newest, previous; 0..65.534 N at 1 mN" },
  { name = "flaps",       type = "fixed", wire = "i16", scale = 0.0001, count = 8, unit = "rad", doc = "flap angles as ACTUATORS.flaps: [TL, TR, BL, BR] newest, then [TL, TR, BL, BR] previous; 0 = extended, increasing = folded toward the back" },
]

[packet.AIR_MISSION]
port = 0x23
qos = "telemetry"
latest = true
rate_air = 5
doc = "Mission state for the radio, the air version of MISSION (same definitions), fixed-point."
fields = [
  { name = "t_us",         type = "u32", unit = "us" },
  { name = "mission_time", type = "fixed", wire = "i32", scale = 0.001, unit = "s", doc = "mission time as MISSION.mission_time, negative during the countdown" },
  { name = "mission_mode", type = "u8", doc = "MissionMode of the active mission (as VEHICLE_STATUS.mission_mode)" },
  { name = "phase",        type = "u8", doc = "MissionPhase (as MISSION.phase)" },
  { name = "index",        type = "u8", doc = "selected mission index (as MISSION.index)" },
  { name = "waypoint",     type = "u8", doc = "current waypoint index of the waypoint mission, 255 = the active mission is not the waypoint mission" },
  { name = "setpoint_pos", type = "fixed", wire = "i32", scale = 0.001, count = 3, unit = "m", doc = "guidance position setpoint, NWU, 1 mm resolution (as AIR_POSE.pos)" },
  { name = "setpoint_vel", type = "fixed", wire = "i16", scale = 0.01, count = 3, unit = "m/s", doc = "guidance velocity setpoint, NWU, +-327.66 m/s (as AIR_POSE.vel)" },
  { name = "setpoint_q",   type = "fixed", wire = "i16", limit = 1.0, count = 4, optional = true, doc = "attitude setpoint of the active attitude controller, [w,x,y,z] body -> world, NWU (as AIR_POSE.q). All four 0 = no attitude setpoint (no attitude controller active), otherwise a unit quaternion. NaN (missing, older sender) = unknown, treat as no setpoint" },
  { name = "flip_start_altitude", type = "fixed", wire = "i16", scale = 0.1, unit = "m", optional = true, doc = "estimated altitude above the position reference (NWU up) at which the upright (flip) manoeuvre will begin, = the vehicle's getStopAltitude() = stopDist(Vz) + stop_altitude, re-estimated continuously. Sent only during the bellyflop freefall phase, otherwise NaN (wire sentinel -32768). 0.1 m steps, +-3276.7 m. Missing (older sender) = NaN" },
  { name = "stop_altitude", type = "fixed", wire = "i16", scale = 0.1, unit = "m", optional = true, doc = "current value of the stop altitude parameter (altitude above the position reference where the vehicle ends up stopped, default 20 m, settable 5..60 m with the SetStopAltitude telecommand while on the ground). Always sent, the echo that confirms a setting. NaN (wire sentinel -32768) = unknown / missing (older sender)" },
]

[packet.AIR_GNSS]
port = 0x24
qos = "telemetry"
latest = true
rate_air = 10
doc = "GNSS position and velocity for the radio at 10 Hz, the air version of GNSS (same source values), fixed-point. Purpose: verify the barometric/estimated altitude during descent. Fix type, satellites and accuracy are in AIR_GNSS_INFO at 1 Hz. The u-blox driver provides the NED velocity vector, so the full velocity is sent, converted to NWU as in GNSS.vel."
fields = [
  { name = "t_us",       type = "u32", unit = "us" },
  { name = "latitude",   type = "fixed", wire = "i32", as = "f64", scale = 1.7453292519943295e-9, unit = "rad", doc = "wire: deg * 1e7 (1.1 cm), +-214.7 deg, NaN = no fix" },
  { name = "longitude",  type = "fixed", wire = "i32", as = "f64", scale = 1.7453292519943295e-9, unit = "rad", doc = "wire: deg * 1e7 (1.1 cm at the equator), +-214.7 deg, NaN = no fix" },
  { name = "altitude",   type = "fixed", wire = "i32", scale = 0.001, unit = "m", doc = "as GNSS.altitude, 1 mm resolution" },
  { name = "vel",        type = "fixed", wire = "i16", scale = 0.01, count = 3, unit = "m/s", doc = "NWU (as GNSS.vel and AIR_POSE.vel), +-327.66 m/s, NaN = unknown" },
]

[packet.AIR_GNSS_INFO]
port = 0x25
qos = "telemetry"
latest = true
rate_air = 1
doc = "GNSS status and accuracy for the radio at 1 Hz (companion of AIR_GNSS, same source values as GNSS)."
fields = [
  { name = "t_us",       type = "u32", unit = "us" },
  { name = "fix_type",   type = "u8", doc = "as GNSS.fix_type" },
  { name = "satellites", type = "u8" },
  { name = "h_acc",      type = "fixed", wire = "u16", scale = 0.01, unit = "m", doc = "horizontal accuracy estimate (1 sigma), 1 cm steps, 0..655.34 m, 65535 = unknown (NaN)" },
  { name = "v_acc",      type = "fixed", wire = "u16", scale = 0.01, unit = "m", doc = "vertical accuracy estimate (1 sigma), 1 cm steps, 0..655.34 m, 65535 = unknown (NaN)" },
]

# ---------------------------------------------------------------- USB set

[packet.POSE]
port = 0x80
qos = "telemetry"
latest = true
rate_usb = 100
doc = "Fast class: attitude [omega, q] and position [V, P], full precision."
fields = [
  { name = "t_us",  type = "u32", unit = "us" },
  { name = "omega", type = "f32", count = 3, unit = "rad/s", doc = "body rates" },
  { name = "q",     type = "f32", count = 4, doc = "[w,x,y,z] body -> world" },
  { name = "vel",   type = "f32", count = 3, unit = "m/s", doc = "NWU" },
  { name = "pos",   type = "f32", count = 3, unit = "m", doc = "NWU from the reset reference" },
]

[packet.ACTUATORS]
port = 0x81
qos = "telemetry"
latest = true
rate_usb = 50
doc = "Actuator outputs."
fields = [
  { name = "t_us",            type = "u32", unit = "us" },
  { name = "flaps",           type = "f32", count = 4, unit = "rad", doc = "[TL, TR, BL, BR]; 0 = extended, increasing = folded toward the back" },
  { name = "tvc",             type = "f32", count = 2, unit = "rad", doc = "thrust vector deflection [x, y]" },
  { name = "thrust",          type = "f32", unit = "N" },
  { name = "ground_distance", type = "f32", unit = "m", doc = "NaN if unavailable" },
  { name = "roll_torque",     type = "f32", optional = true, unit = "N*m", doc = "TVC twist (roll) actuation as the roll torque about body Z the vanes produce (same meaning as AIR_ACTUATORS.roll_torque, unquantised). Missing (older sender) decodes as NaN = unknown" },
]

[packet.MISSION]
port = 0x82
qos = "telemetry"
latest = true
rate_usb = 20
doc = "Mission setpoints and progress."
fields = [
  { name = "t_us",        type = "u32", unit = "us" },
  { name = "setpoint_pos", type = "f32", count = 3, unit = "m" },
  { name = "setpoint_vel", type = "f32", count = 3, unit = "m/s" },
  { name = "mission_time", type = "fixed", wire = "i32", scale = 0.001, unit = "s" },
  { name = "index",        type = "u8" },
  { name = "phase",        type = "u8" },
  { name = "setpoint_q",   type = "f32", count = 4, optional = true, doc = "attitude setpoint of the active attitude controller, [w,x,y,z] body -> world, NWU (as POSE.q). All four 0 = no attitude setpoint (no attitude controller active), otherwise a unit quaternion. NaN (missing, older sender) = unknown, treat as no setpoint" },
  { name = "mission_mode", type = "u8", optional = true, doc = "MissionMode of the active mission (Idle, Initialisation, Startup, Running, Finished), as AIR_MISSION.mission_mode and VEHICLE_STATUS.mission_mode. Missing (older sender) decodes as 0" },
  { name = "waypoint",     type = "u8", optional = true, doc = "current waypoint index, 255 = the active mission is not the waypoint mission (as AIR_MISSION.waypoint). Missing (older sender) decodes as 0, so use mission_mode/VEHICLE_STATUS to know the sender is new" },
  { name = "flip_start_altitude", type = "f32", unit = "m", optional = true, doc = "estimated altitude above the position reference (NWU up) at which the upright (flip) manoeuvre will begin, = the vehicle's getStopAltitude() = stopDist(Vz) + stop_altitude, re-estimated continuously. Sent only during the bellyflop freefall phase, otherwise NaN. Missing (older sender) = NaN" },
  { name = "stop_altitude", type = "f32", unit = "m", optional = true, doc = "current value of the stop altitude parameter (altitude above the position reference where the vehicle ends up stopped, default 20 m, settable 5..60 m with the SetStopAltitude telecommand while on the ground). Always sent, the echo that confirms a setting. NaN = unknown / missing (older sender)" },
]

[packet.CMD_APPLIED]
port = 0x84
qos = "telemetry"
latest = true
rate_usb = 10
doc = "GS-control design, USB only (no air cost; replaces RC_APPLIED at 0x84): the CMD_STATE fields as the vehicle applies them (last accepted frame of the latched session), the transition detectors' safe-seen bits, ages, the latched session and the reject counters. For bench debugging of the command path."
fields = [
  { name = "t_us",       type = "u32", unit = "us" },
  { name = "go",         type = "enum", enum = "CmdGo", doc = "last accepted go (NOT_GO if none yet)" },
  { name = "profile",    type = "u8", doc = "last accepted profile 0, 1, 2" },
  { name = "vehicle_mode", type = "enum", enum = "CmdVehicleMode", doc = "last accepted vehicle_mode field (not the applied mode)" },
  { name = "motors",     type = "enum", enum = "CmdMotors", doc = "last accepted motors field" },
  { name = "reset_button", type = "enum", enum = "CmdButton", doc = "last accepted reset_button field" },
  { name = "failsafe",   type = "enum", enum = "CmdFailsafe", doc = "last accepted failsafe field" },
  { name = "flags",      type = "u8", bits = { POCKET_LIVE = 0, INPUT_VIRTUAL = 1 }, doc = "the information flags of the last accepted CMD_STATE (POCKET_LIVE = CMD_STATE flags bit 1, INPUT_VIRTUAL = bit 2); reported, never acted on. Bits 2..7 reserved" },
  { name = "safe_seen",  type = "u8", bits = { GO = 0, SC_REAL = 1, SD_ENABLE = 2, SE_PRESS = 3 }, doc = "each unsafe-direction detector's 'safe value seen' bit (set: an edge may be reported). SC_REAL: vehicle_mode REAL seen (or SIMULATION seen for the reverse edge, as the mapper defines it). Bits 4..7 reserved" },
  { name = "session",    type = "u32", doc = "full latched session id, 0 = none" },
  { name = "age",        type = "fixed", wire = "u16", scale = 0.001, unit = "s", doc = "age of the last accepted CMD_STATE (either link), invalid (NaN) = none" },
  { name = "usb_age",    type = "fixed", wire = "u16", scale = 0.001, unit = "s", doc = "age of the last accepted or duplicate copy of the latched session on the USB link, invalid (NaN) = none" },
  { name = "uart_age",   type = "fixed", wire = "u16", scale = 0.001, unit = "s", doc = "same for the UART link" },
  { name = "rejects",    type = "u8", count = 4, doc = "wrapping reject counters per reason: [0] bad length or field out of range, [1] source (src not 0), [2] foreign session, [3] stale or duplicate sequence" },
]

[packet.GNSS]
port = 0x83
qos = "telemetry"
latest = true
rate_usb = 10
doc = "GNSS solution at 10 Hz (the latest receiver solution; 5 Hz before 2026-11-21). Latitude and longitude in radians as f64 (full receiver resolution, 1e-7 degree is about 1 cm), altitude in metres as the receiver driver reports it (the u-blox height above the WGS-84 ellipsoid, not above mean sea level: it differs from the barometric altitude by the geoid separation, so compare changes or values relative to the pad, not absolute values). Used to verify the barometric/estimated altitude during descent; AIR_GNSS is the compact version for the radio."
fields = [
  { name = "t_us",     type = "u32", unit = "us" },
  { name = "latitude",  type = "f64", unit = "rad" },
  { name = "longitude", type = "f64", unit = "rad" },
  { name = "altitude",  type = "f32", unit = "m" },
  { name = "vel",       type = "f32", count = 3, unit = "m/s", doc = "NWU" },
  { name = "satellites", type = "u8" },
  { name = "fix_type",   type = "u8" },
  { name = "h_acc",      type = "f32", unit = "m" },
  { name = "v_acc",      type = "f32", unit = "m" },
  { name = "s_acc",      type = "f32", unit = "m/s" },
]

# ---------------------------------------------------------------- debug (USB only)

[packet.IMU_RAW]
port = 0x90
qos = "telemetry"
latest = true
rate_usb = 100
doc = "Raw, uncalibrated sensor values in the sensor frame (the driver outputs, before calibration and the sensor->body transform). CALIBRATION holds what the vehicle applies to them."
fields = [
  { name = "t_us",     type = "u32", unit = "us" },
  { name = "gyro",     type = "f32", count = 3, unit = "rad/s", doc = "uncalibrated, sensor frame (Starship: MPU9250 driver output, chip axes remapped by the driver)" },
  { name = "accel",    type = "f32", count = 3, unit = "m/s^2", doc = "uncalibrated, sensor frame, specific force (reads +g upward at rest)" },
  { name = "mag",      type = "f32", count = 3, unit = "T", doc = "uncalibrated (no hard/soft iron), sensor frame (Starship: QMC5883 driver output)" },
  { name = "pressure", type = "f32", unit = "Pa" },
  { name = "temperature", type = "f32", unit = "K" },
]

[packet.ESTIMATOR]
port = 0x91
qos = "telemetry"
latest = true
rate_usb = 20
doc = "Estimator accuracy (standard deviations)."
fields = [
  { name = "t_us",    type = "u32", unit = "us" },
  { name = "att_std", type = "f32", count = 3, unit = "rad" },
  { name = "vel_std", type = "f32", count = 3, unit = "m/s" },
  { name = "pos_std", type = "f32", count = 3, unit = "m" },
]

[packet.TASK_TIMING]
port = 0x92
qos = "telemetry"
latest = true
rate_usb = 5
doc = "Execution time of the first 8 scheduler tasks."
fields = [
  { name = "t_us",  type = "u32", unit = "us" },
  { name = "count", type = "u8", doc = "number of valid entries, <= 8" },
  { name = "avg",   type = "fixed", wire = "u16", scale = 1e-6, count = 8, unit = "s" },
  { name = "max",   type = "fixed", wire = "u16", scale = 1e-6, count = 8, unit = "s" },
]

# CALIBRATION reproduces the vehicle's calibrated sensor values from IMU_RAW. For each sensor s in {gyro, accel, mag},
# with raw = the IMU_RAW field and M = s_matrix as a 3x3 matrix, row-major (M[r][c] = s_matrix[3*r + c]):
#     cal = M * (raw - s_offset)
# Nothing else is applied (no temperature terms, no extra axis remap). The vehicle computes the same thing with its
# internal units (gyro rad/s, accel m/s^2, mag gauss = T * 1e4); cal is then that value in SI, the mag in T.
[packet.CALIBRATION]
port = 0x93
qos = "telemetry"
latest = true
doc = "Sensor calibration currently applied by the vehicle (continuous state, USB only, sent at 0.5 Hz: every 2 s; the integer rate fields cannot express it). Reproduces the calibrated gyro, accel and mag values from IMU_RAW: for each sensor, cal = M * (raw - offset) with M the 3x3 *_matrix row-major (M[r][c] = matrix[3*r + c]) and raw the IMU_RAW field in raw_frame; no temperature terms, no further remap. M already includes the sensor->body transform, so cal is in the body frame. The *_source bits say where the values came from. gyro_bias_est is the attitude EKF's own gyro bias state, subtracted after calibration (POSE omega = gyro cal - gyro_bias_est)."
fields = [
  { name = "t_us",          type = "u32", unit = "us" },
  { name = "raw_frame",     type = "enum", enum = "ImuFrame", doc = "frame of the IMU_RAW values these parameters apply to (SENSOR = driver output frame, before calibration)" },
  { name = "gyro_source",   type = "u8", bits = { CALIB_EEPROM = 0, TRANSFORM_EEPROM = 1, OFFSET_OVERRIDE = 2, RAM_ONLY = 3, MEMORY_CLEARED = 4 }, doc = "CALIB_EEPROM: offset/scale item read from EEPROM (else identity defaults). TRANSFORM_EEPROM: sensor->body matrix read from EEPROM (else identity). OFFSET_OVERRIDE: offset hard-coded in the firmware, the stored one is ignored. RAM_ONLY: changed at run time, not saved yet. MEMORY_CLEARED: EEPROM image cleared at boot (version mismatch)" },
  { name = "accel_source",  type = "u8", bits = { CALIB_EEPROM = 0, TRANSFORM_EEPROM = 1, OFFSET_OVERRIDE = 2, RAM_ONLY = 3, MEMORY_CLEARED = 4 }, doc = "as gyro_source" },
  { name = "mag_source",    type = "u8", bits = { CALIB_EEPROM = 0, TRANSFORM_EEPROM = 1, OFFSET_OVERRIDE = 2, RAM_ONLY = 3, MEMORY_CLEARED = 4 }, doc = "as gyro_source" },
  { name = "gyro_offset",   type = "f32", count = 3, unit = "rad/s", doc = "subtracted from the raw gyro, raw frame" },
  { name = "gyro_matrix",   type = "f32", count = 9, doc = "row-major 3x3, scale/misalignment times sensor->body" },
  { name = "accel_offset",  type = "f32", count = 3, unit = "m/s^2", doc = "subtracted from the raw accel, raw frame" },
  { name = "accel_matrix",  type = "f32", count = 9, doc = "row-major 3x3, scale/misalignment times sensor->body" },
  { name = "mag_offset",    type = "f32", count = 3, unit = "T", doc = "hard-iron offset, subtracted from the raw mag, raw frame" },
  { name = "mag_matrix",    type = "f32", count = 9, doc = "row-major 3x3, soft-iron/scale times sensor->body (dimensionless: T in, T out)" },
  { name = "gyro_bias_est", type = "f32", count = 3, unit = "rad/s", doc = "attitude EKF gyro bias state, body frame, subtracted from the calibrated gyro" },
]

# ---------------------------------------------------------------- request objects

[packet.HOME_POSITION]
port = 0x50
qos = "event"
latest = false
doc = "Response object of the request channel 0x50 (workspace docs/reliable-transport-design.md 8.1; the generator does not yet know `kind = request`, so this is a plain packet definition of the object, and the transport sends it through RequestChannel/ResponderChannel, not as a stream). The REQUEST ARGS are EMPTY (zero bytes): the GS asks, the vehicle answers once; it is not streamed. Home = the position estimator's reference (the NWU origin), set at reset, refined in zeroing windows, fixed from go to landing unless reset. Failure (no reference yet) is the response status NO_DATA of the transport, not a field here."
fields = [
  { name = "flags",     type = "u8", bits = { LATLON_VALID = 0, ALT_VALID = 1, SIMULATION = 2, ZEROING = 3 }, doc = "LATLON_VALID: latitude/longitude are set. ALT_VALID: altitude is set. SIMULATION: the reference comes from the simulator, not from GNSS. ZEROING: an estimator zeroing window was active (the reference may still be refined)" },
  { name = "latitude",  type = "fixed", wire = "i32", as = "f64", scale = 1.7453292519943295e-9, unit = "rad", doc = "wire: deg * 1e7; NaN when LATLON_VALID is clear" },
  { name = "longitude", type = "fixed", wire = "i32", as = "f64", scale = 1.7453292519943295e-9, unit = "rad", doc = "wire: deg * 1e7; NaN when LATLON_VALID is clear" },
  { name = "altitude",  type = "fixed", wire = "i32", scale = 0.001, unit = "m", doc = "the origin's altitude as the estimator uses it (same datum as GNSS.altitude), 1 mm; NaN when ALT_VALID is clear" },
  { name = "h_acc",     type = "fixed", wire = "u16", scale = 0.01, unit = "m", doc = "horizontal accuracy of the reference, 1 cm steps, 65535 = unknown (NaN)" },
  { name = "epoch",     type = "u8", doc = "increments whenever the home reference changes (the value VEHICLE_STATUS.home_epoch will carry); lets the GS detect a stale copy" },
  { name = "set_time",  type = "i64", unit = "ns", doc = "vehicle time (ns) when the reference was last set or refined; 0 = never" },
  { name = "reserved",  type = "u8", doc = "zero" },
]
