# Starship vehicle packets (network-design.md 3.5.6, adapted by the user decisions in its Revision 1 box).
#
# Two telemetry sets:
#   AIR set (radio, ports < 0x80, bare minimum, fixed-point): VEHICLE_STATUS, AIR_POSE, AIR_ACTUATORS, AIR_MISSION, plus HANDSET_TELEM and
#     LINK_STATS from common.toml.
#   USB set (everything, ports >= 0x80 are USB only, f32/f64): the AIR set packets that have a USB rate, plus
#     POSE, ACTUATORS, MISSION, GNSS and the debug packets. AIR_POSE is not sent on USB (POSE supersedes it).
# Packets are grouped by rate class: POSE is the fast class, VEHICLE_STATUS/MISSION/ACTUATORS the slower ones.
# All decoded physical values are SI. Timestamps t_us / t_ns are integer counters (wrap handling needs integers).
# Frames: NWU world, attitude q = [w,x,y,z] body -> world, position [V(3), P(3)].

[schema]
name = "starship"
doc = "Starship vehicle telemetry."

# LINK_UPLOAD_MODE (10): target = link module node id (2 = TX module, 3 = RX module). The module stops
# the air link and enters its over-the-air firmware upload (WiFi) mode. Always honoured, no safety
# condition (user decision 2026-11-19): senders must never send it unintentionally. arg_i/arg_f = 0,
# REQUEST_ACK detail = 0.
# LINK_REBOOT (11): same semantics (target, always honoured, ACK first, 400 ms delay, idempotent), but the module
# does a clean software restart instead. A reboot of the RX module in flight stops RC for a few seconds
# (failsafe): senders must guard it.
[enum.RequestAction]
type = "u8"
values = { NONE = 0, CALIB_GYRO_START = 1, CALIB_GYRO_STOP = 2, CALIB_ACCEL_START = 3, CALIB_ACCEL_STOP = 4, CALIB_MAG_START = 5, CALIB_MAG_STOP = 6, CALIB_APPLY = 7, SAVE_CONFIG = 8, SYSTEM_RESET = 9, LINK_UPLOAD_MODE = 10, LINK_REBOOT = 11 }

# Frame of the raw sensor values that CALIBRATION applies to (IMU_RAW gyro, accel, mag).
[enum.ImuFrame]
type = "u8"
values = { SENSOR = 0, BODY = 1 }

[enum.ControlSource]
type = "u8"
values = { NONE = 0, RADIO = 1, USB = 2, UART = 3 }

# ---------------------------------------------------------------- AIR set

[packet.VEHICLE_STATUS]
port = 0x20
qos = "link"
latest = true
rate_air = 5
rate_usb = 20
doc = "Mode and health, the slow class. Reports what the vehicle applied (safety.md 2.6)."
fields = [
  { name = "t_us",            type = "u32", unit = "us", doc = "vehicle time, (NowNs/1000) mod 2^32" },
  { name = "t_ns",            type = "i64", unit = "ns", doc = "full vehicle time NowNs()" },
  { name = "mode",            type = "u8", doc = "flight software mode (numbering owned by the flight software docs)" },
  { name = "mission_mode",    type = "u8" },
  { name = "mission_phase",   type = "u8" },
  { name = "ctrl_source",     type = "enum", enum = "ControlSource", doc = "active control source" },
  { name = "flags",           type = "u8", bits = { ARMED = 0, SIMULATION = 1, MOTORS_ENABLED = 2, GS_PRESENT = 3, INCOMPATIBLE = 4, FAILSAFE = 5, UART_PEER_SEEN = 6, ZEROING = 7 }, doc = "ARMED: applied arm state. MOTORS_ENABLED: the hard motor gate is currently open. UART_PEER_SEEN: a valid frame from the ship radio node (node 3) arrived on the vehicle UART within the last 3 s (information only, the vehicle never acts on it). ZEROING: an estimator zeroing window is active (automatic boot zero or ZeroEstimators); the vehicle must be kept still, Arm and MissionBegin are refused." },
  { name = "failure_bits",    type = "u32" },
  { name = "sensor_state",    type = "u16" },
  { name = "last_req_id",     type = "u16", doc = "last executed REQUEST id, 0 = none" },
  { name = "last_req_status", type = "u8", doc = "RequestStatus value of last_req_id" },
  { name = "rc_age",          type = "fixed", wire = "u16", scale = 0.001, unit = "s", doc = "age of the last accepted RC_STATE, invalid (NaN) = none" },
]

[packet.AIR_POSE]
port = 0x21
qos = "telemetry"
latest = true
rate_air = 10
doc = "Minimal pose for the radio: attitude, position and velocity, fixed-point."
fields = [
  { name = "t_us", type = "u32", unit = "us" },
  { name = "q",    type = "fixed", wire = "i16", limit = 1.0, count = 4, doc = "[w,x,y,z] body -> world" },
  { name = "pos",  type = "fixed", wire = "i32", scale = 0.001, count = 3, unit = "m", doc = "NWU, 1 mm resolution, +-2147483.6 m" },
  { name = "vel",  type = "fixed", wire = "i16", scale = 0.01, count = 3, unit = "m/s", doc = "NWU, +-327.66 m/s" },
]

[packet.AIR_ACTUATORS]
port = 0x22
qos = "telemetry"
latest = true
rate_air = 25
doc = "Actuator outputs for flight recording over the radio: two samples per packet (newest and the previous one, nominally 20 ms older), so 25 packets/s give 50 samples/s and one lost packet loses no sample. Same source and definitions as ACTUATORS. Array order: the newest sample first, then the previous one."
fields = [
  { name = "t_us",        type = "u32", unit = "us", doc = "vehicle time of the newest sample, (NowNs/1000) mod 2^32" },
  { name = "prev_age",    type = "fixed", wire = "u16", scale = 0.000001, unit = "s", doc = "newest sample time minus previous sample time (nominally 0.020 s), NaN = no previous sample (its values are NaN too)" },
  { name = "tvc",         type = "fixed", wire = "i16", scale = 0.0001, count = 4, unit = "rad", doc = "thrust vector deflection as ACTUATORS.tvc: [x, y] newest, then [x, y] previous; +-3.2767 rad at 0.1 mrad" },
  { name = "roll_torque", type = "fixed", wire = "i16", scale = 0.00001, count = 2, unit = "N*m", doc = "TVC twist (roll) actuation as the roll torque about body Z the vanes produce: newest, previous; +-0.32767 N*m at 0.01 mN*m" },
  { name = "thrust",      type = "fixed", wire = "u16", scale = 0.001, count = 2, unit = "N", doc = "thrust magnitude as ACTUATORS.thrust: newest, previous; 0..65.534 N at 1 mN" },
  { name = "flaps",       type = "fixed", wire = "i16", scale = 0.0001, count = 8, unit = "rad", doc = "flap angles as ACTUATORS.flaps: [TL, TR, BL, BR] newest, then [TL, TR, BL, BR] previous; 0 = extended, increasing = folded toward the back" },
]

[packet.AIR_MISSION]
port = 0x23
qos = "telemetry"
latest = true
rate_air = 5
doc = "Mission state for the radio, the air version of MISSION (same definitions), fixed-point."
fields = [
  { name = "t_us",         type = "u32", unit = "us" },
  { name = "mission_time", type = "fixed", wire = "i32", scale = 0.001, unit = "s", doc = "mission time as MISSION.mission_time, negative during the countdown" },
  { name = "mission_mode", type = "u8", doc = "MissionMode of the active mission (as VEHICLE_STATUS.mission_mode)" },
  { name = "phase",        type = "u8", doc = "MissionPhase (as MISSION.phase)" },
  { name = "index",        type = "u8", doc = "selected mission index (as MISSION.index)" },
  { name = "waypoint",     type = "u8", doc = "current waypoint index of the waypoint mission, 255 = the active mission is not the waypoint mission" },
  { name = "setpoint_pos", type = "fixed", wire = "i32", scale = 0.001, count = 3, unit = "m", doc = "guidance position setpoint, NWU, 1 mm resolution (as AIR_POSE.pos)" },
  { name = "setpoint_vel", type = "fixed", wire = "i16", scale = 0.01, count = 3, unit = "m/s", doc = "guidance velocity setpoint, NWU, +-327.66 m/s (as AIR_POSE.vel)" },
  { name = "setpoint_q",   type = "fixed", wire = "i16", limit = 1.0, count = 4, optional = true, doc = "attitude setpoint of the active attitude controller, [w,x,y,z] body -> world, NWU (as AIR_POSE.q). All four 0 = no attitude setpoint (no attitude controller active), otherwise a unit quaternion. NaN (missing, older sender) = unknown, treat as no setpoint" },
]

[packet.AIR_GNSS]
port = 0x24
qos = "telemetry"
latest = true
rate_air = 10
doc = "GNSS solution for the radio, the air version of GNSS (same source values, same datum), fixed-point. Purpose: verify the barometric/estimated altitude during descent, so altitude and vertical speed are included; the 3D velocity vector is reduced to ground speed and vertical speed. fix_type and satellites are as GNSS."
fields = [
  { name = "t_us",       type = "u32", unit = "us" },
  { name = "latitude",   type = "fixed", wire = "i32", as = "f64", scale = 1.7453292519943295e-9, unit = "rad", doc = "wire: deg * 1e7 (1.1 cm), +-214.7 deg, NaN = no fix" },
  { name = "longitude",  type = "fixed", wire = "i32", as = "f64", scale = 1.7453292519943295e-9, unit = "rad", doc = "wire: deg * 1e7 (1.1 cm at the equator), +-214.7 deg, NaN = no fix" },
  { name = "altitude",   type = "fixed", wire = "i32", scale = 0.001, unit = "m", doc = "as GNSS.altitude (height above the ellipsoid), 1 mm resolution" },
  { name = "fix_type",   type = "u8", doc = "as GNSS.fix_type" },
  { name = "satellites", type = "u8" },
  { name = "h_acc",      type = "fixed", wire = "u16", scale = 0.01, unit = "m", doc = "horizontal accuracy estimate (1 sigma), 1 cm steps, 0..655.34 m, 65535 = unknown (NaN)" },
  { name = "v_acc",      type = "fixed", wire = "u16", scale = 0.01, unit = "m", doc = "vertical accuracy estimate (1 sigma), 1 cm steps, 0..655.34 m, 65535 = unknown (NaN)" },
  { name = "ground_speed", type = "fixed", wire = "u16", scale = 0.01, unit = "m/s", doc = "horizontal speed over ground = hypot(GNSS.vel[0], GNSS.vel[1]), 0..655.34 m/s, 65535 = unknown (NaN)" },
  { name = "vert_speed", type = "fixed", wire = "i16", scale = 0.01, unit = "m/s", doc = "vertical speed, positive UP (NWU: GNSS.vel[2]), +-327.66 m/s, -32768 = unknown (NaN)" },
]

# ---------------------------------------------------------------- USB set

[packet.POSE]
port = 0x80
qos = "telemetry"
latest = true
rate_usb = 100
doc = "Fast class: attitude [omega, q] and position [V, P], full precision."
fields = [
  { name = "t_us",  type = "u32", unit = "us" },
  { name = "omega", type = "f32", count = 3, unit = "rad/s", doc = "body rates" },
  { name = "q",     type = "f32", count = 4, doc = "[w,x,y,z] body -> world" },
  { name = "vel",   type = "f32", count = 3, unit = "m/s", doc = "NWU" },
  { name = "pos",   type = "f32", count = 3, unit = "m", doc = "NWU from the reset reference" },
]

[packet.ACTUATORS]
port = 0x81
qos = "telemetry"
latest = true
rate_usb = 50
doc = "Actuator outputs."
fields = [
  { name = "t_us",            type = "u32", unit = "us" },
  { name = "flaps",           type = "f32", count = 4, unit = "rad", doc = "[TL, TR, BL, BR]; 0 = extended, increasing = folded toward the back" },
  { name = "tvc",             type = "f32", count = 2, unit = "rad", doc = "thrust vector deflection [x, y]" },
  { name = "thrust",          type = "f32", unit = "N" },
  { name = "ground_distance", type = "f32", unit = "m", doc = "NaN if unavailable" },
]

[packet.MISSION]
port = 0x82
qos = "telemetry"
latest = true
rate_usb = 20
doc = "Mission setpoints and progress."
fields = [
  { name = "t_us",        type = "u32", unit = "us" },
  { name = "setpoint_pos", type = "f32", count = 3, unit = "m" },
  { name = "setpoint_vel", type = "f32", count = 3, unit = "m/s" },
  { name = "mission_time", type = "fixed", wire = "i32", scale = 0.001, unit = "s" },
  { name = "index",        type = "u8" },
  { name = "phase",        type = "u8" },
  { name = "setpoint_q",   type = "f32", count = 4, optional = true, doc = "attitude setpoint of the active attitude controller, [w,x,y,z] body -> world, NWU (as POSE.q). All four 0 = no attitude setpoint (no attitude controller active), otherwise a unit quaternion. NaN (missing, older sender) = unknown, treat as no setpoint" },
]

[packet.GNSS]
port = 0x83
qos = "telemetry"
latest = true
rate_usb = 10
doc = "GNSS solution at 10 Hz (the latest receiver solution; 5 Hz before 2026-11-21). Latitude and longitude in radians as f64 (full receiver resolution, 1e-7 degree is about 1 cm), altitude in metres as the receiver driver reports it (the u-blox height above the WGS-84 ellipsoid, not above mean sea level: it differs from the barometric altitude by the geoid separation, so compare changes or values relative to the pad, not absolute values). Used to verify the barometric/estimated altitude during descent; AIR_GNSS is the compact version for the radio."
fields = [
  { name = "t_us",     type = "u32", unit = "us" },
  { name = "latitude",  type = "f64", unit = "rad" },
  { name = "longitude", type = "f64", unit = "rad" },
  { name = "altitude",  type = "f32", unit = "m" },
  { name = "vel",       type = "f32", count = 3, unit = "m/s", doc = "NWU" },
  { name = "satellites", type = "u8" },
  { name = "fix_type",   type = "u8" },
  { name = "h_acc",      type = "f32", unit = "m" },
  { name = "v_acc",      type = "f32", unit = "m" },
  { name = "s_acc",      type = "f32", unit = "m/s" },
]

# ---------------------------------------------------------------- debug (USB only)

[packet.IMU_RAW]
port = 0x90
qos = "telemetry"
latest = true
rate_usb = 100
doc = "Raw, uncalibrated sensor values in the sensor frame (the driver outputs, before calibration and the sensor->body transform). CALIBRATION holds what the vehicle applies to them."
fields = [
  { name = "t_us",     type = "u32", unit = "us" },
  { name = "gyro",     type = "f32", count = 3, unit = "rad/s", doc = "uncalibrated, sensor frame (Starship: MPU9250 driver output, chip axes remapped by the driver)" },
  { name = "accel",    type = "f32", count = 3, unit = "m/s^2", doc = "uncalibrated, sensor frame, specific force (reads +g upward at rest)" },
  { name = "mag",      type = "f32", count = 3, unit = "T", doc = "uncalibrated (no hard/soft iron), sensor frame (Starship: QMC5883 driver output)" },
  { name = "pressure", type = "f32", unit = "Pa" },
  { name = "temperature", type = "f32", unit = "K" },
]

[packet.ESTIMATOR]
port = 0x91
qos = "telemetry"
latest = true
rate_usb = 20
doc = "Estimator accuracy (standard deviations)."
fields = [
  { name = "t_us",    type = "u32", unit = "us" },
  { name = "att_std", type = "f32", count = 3, unit = "rad" },
  { name = "vel_std", type = "f32", count = 3, unit = "m/s" },
  { name = "pos_std", type = "f32", count = 3, unit = "m" },
]

[packet.TASK_TIMING]
port = 0x92
qos = "telemetry"
latest = true
rate_usb = 5
doc = "Execution time of the first 8 scheduler tasks."
fields = [
  { name = "t_us",  type = "u32", unit = "us" },
  { name = "count", type = "u8", doc = "number of valid entries, <= 8" },
  { name = "avg",   type = "fixed", wire = "u16", scale = 1e-6, count = 8, unit = "s" },
  { name = "max",   type = "fixed", wire = "u16", scale = 1e-6, count = 8, unit = "s" },
]

# CALIBRATION reproduces the vehicle's calibrated sensor values from IMU_RAW. For each sensor s in {gyro, accel, mag},
# with raw = the IMU_RAW field and M = s_matrix as a 3x3 matrix, row-major (M[r][c] = s_matrix[3*r + c]):
#     cal = M * (raw - s_offset)
# Nothing else is applied (no temperature terms, no extra axis remap). The vehicle computes the same thing with its
# internal units (gyro rad/s, accel m/s^2, mag gauss = T * 1e4); cal is then that value in SI, the mag in T.
[packet.CALIBRATION]
port = 0x93
qos = "telemetry"
latest = true
doc = "Sensor calibration currently applied by the vehicle (continuous state, USB only, sent at 0.5 Hz: every 2 s; the integer rate fields cannot express it). Reproduces the calibrated gyro, accel and mag values from IMU_RAW: for each sensor, cal = M * (raw - offset) with M the 3x3 *_matrix row-major (M[r][c] = matrix[3*r + c]) and raw the IMU_RAW field in raw_frame; no temperature terms, no further remap. M already includes the sensor->body transform, so cal is in the body frame. The *_source bits say where the values came from. gyro_bias_est is the attitude EKF's own gyro bias state, subtracted after calibration (POSE omega = gyro cal - gyro_bias_est)."
fields = [
  { name = "t_us",          type = "u32", unit = "us" },
  { name = "raw_frame",     type = "enum", enum = "ImuFrame", doc = "frame of the IMU_RAW values these parameters apply to (SENSOR = driver output frame, before calibration)" },
  { name = "gyro_source",   type = "u8", bits = { CALIB_EEPROM = 0, TRANSFORM_EEPROM = 1, OFFSET_OVERRIDE = 2, RAM_ONLY = 3, MEMORY_CLEARED = 4 }, doc = "CALIB_EEPROM: offset/scale item read from EEPROM (else identity defaults). TRANSFORM_EEPROM: sensor->body matrix read from EEPROM (else identity). OFFSET_OVERRIDE: offset hard-coded in the firmware, the stored one is ignored. RAM_ONLY: changed at run time, not saved yet. MEMORY_CLEARED: EEPROM image cleared at boot (version mismatch)" },
  { name = "accel_source",  type = "u8", bits = { CALIB_EEPROM = 0, TRANSFORM_EEPROM = 1, OFFSET_OVERRIDE = 2, RAM_ONLY = 3, MEMORY_CLEARED = 4 }, doc = "as gyro_source" },
  { name = "mag_source",    type = "u8", bits = { CALIB_EEPROM = 0, TRANSFORM_EEPROM = 1, OFFSET_OVERRIDE = 2, RAM_ONLY = 3, MEMORY_CLEARED = 4 }, doc = "as gyro_source" },
  { name = "gyro_offset",   type = "f32", count = 3, unit = "rad/s", doc = "subtracted from the raw gyro, raw frame" },
  { name = "gyro_matrix",   type = "f32", count = 9, doc = "row-major 3x3, scale/misalignment times sensor->body" },
  { name = "accel_offset",  type = "f32", count = 3, unit = "m/s^2", doc = "subtracted from the raw accel, raw frame" },
  { name = "accel_matrix",  type = "f32", count = 9, doc = "row-major 3x3, scale/misalignment times sensor->body" },
  { name = "mag_offset",    type = "f32", count = 3, unit = "T", doc = "hard-iron offset, subtracted from the raw mag, raw frame" },
  { name = "mag_matrix",    type = "f32", count = 9, doc = "row-major 3x3, soft-iron/scale times sensor->body (dimensionless: T in, T out)" },
  { name = "gyro_bias_est", type = "f32", count = 3, unit = "rad/s", doc = "attitude EKF gyro bias state, body frame, subtracted from the calibrated gyro" },
]

# ---------------------------------------------------------------- request objects

[packet.HOME_POSITION]
port = 0x50
qos = "event"
latest = false
doc = "Response object of the request channel 0x50 (workspace docs/reliable-transport-design.md 8.1; the generator does not yet know `kind = request`, so this is a plain packet definition of the object, and the transport sends it through RequestChannel/ResponderChannel, not as a stream). The REQUEST ARGS are EMPTY (zero bytes): the GS asks, the vehicle answers once; it is not streamed. Home = the position estimator's reference (the NWU origin), set at reset, refined in zeroing windows, fixed from go to landing unless reset. Failure (no reference yet) is the response status NO_DATA of the transport, not a field here."
fields = [
  { name = "flags",     type = "u8", bits = { LATLON_VALID = 0, ALT_VALID = 1, SIMULATION = 2, ZEROING = 3 }, doc = "LATLON_VALID: latitude/longitude are set. ALT_VALID: altitude is set. SIMULATION: the reference comes from the simulator, not from GNSS. ZEROING: an estimator zeroing window was active (the reference may still be refined)" },
  { name = "latitude",  type = "fixed", wire = "i32", as = "f64", scale = 1.7453292519943295e-9, unit = "rad", doc = "wire: deg * 1e7; NaN when LATLON_VALID is clear" },
  { name = "longitude", type = "fixed", wire = "i32", as = "f64", scale = 1.7453292519943295e-9, unit = "rad", doc = "wire: deg * 1e7; NaN when LATLON_VALID is clear" },
  { name = "altitude",  type = "fixed", wire = "i32", scale = 0.001, unit = "m", doc = "the origin's altitude as the estimator uses it (same datum as GNSS.altitude), 1 mm; NaN when ALT_VALID is clear" },
  { name = "h_acc",     type = "fixed", wire = "u16", scale = 0.01, unit = "m", doc = "horizontal accuracy of the reference, 1 cm steps, 65535 = unknown (NaN)" },
  { name = "epoch",     type = "u8", doc = "increments whenever the home reference changes (the value VEHICLE_STATUS.home_epoch will carry); lets the GS detect a stale copy" },
  { name = "set_time",  type = "i64", unit = "ns", doc = "vehicle time (ns) when the reference was last set or refined; 0 = never" },
  { name = "reserved",  type = "u8", doc = "zero" },
]
